name = "astraflow-automation-hub"
main = "worker.js"
compatibility_date = "2026-10-09"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/webhooks/*"]

[[d1_databases]]
binding = "DB"
database_name = "astraflow-leads"
# Replace after creating the database: npx wrangler d1 create astraflow-leads
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
